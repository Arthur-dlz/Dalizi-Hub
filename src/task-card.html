<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大狸子任务卡</title>
  <style>
    /* 看板风状态卡（P5 UX1）：走秒解耦 + 阶段条 + 徽章体系 + 宿主主题 + 防截断。
       主题消费链（宿主 --cb-* 优先，回退既有变量，再回退硬编码）：
       var(--cb-*, var(--color-*, 常量))。JS 层收到 host-context-changed 后
       以 dataset.theme 锁定；首帧 hostContext 可能为空对象（已知行为），
       未锁定时由 color-scheme: light dark 兜底。 */
    :root {
      color-scheme: light dark;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      --dlz-text: var(--cb-color-text-primary, var(--color-text-primary, #202123));
      --dlz-text-2: var(--cb-color-text-secondary, var(--color-text-secondary, #6b6b6b));
      --dlz-bg: var(--cb-color-background-primary, var(--color-background-primary, #fff));
      --dlz-bg-2: var(--cb-color-background-secondary, var(--color-background-secondary, #fff));
      --dlz-bg-3: var(--cb-color-background-tertiary, var(--color-background-tertiary, #f5f5f5));
      --dlz-border: var(--cb-color-border-default, var(--color-border-default, #dedede));
      --dlz-blue-bg: var(--cb-color-accent-bg, #e9f4ff);
      --dlz-blue-fg: var(--cb-color-accent-fg, #1264a3);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px; color: var(--dlz-text); background: var(--dlz-bg); }
    .card { max-width: 640px; border: 1px solid var(--dlz-border); border-radius: 14px; padding: 16px 18px; background: var(--dlz-bg-2); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h1 { margin: 0; font-size: 16px; font-weight: 650; }
    h2 { margin: 0 0 6px; font-size: 12px; font-weight: 650; color: var(--dlz-text-2); }
    .badge { border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700; background: var(--dlz-blue-bg); color: var(--dlz-blue-fg); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .badge.queued { background: #ececef; color: #5c5c66; }
    .badge.running { background: var(--dlz-blue-bg); color: var(--dlz-blue-fg); }
    .badge.running::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: dlz-pulse 1.2s ease-in-out infinite; }
    .badge.completed { background: #e5f6ed; color: #167347; }
    .badge.failed { background: #fce9e9; color: #a33030; }
    .badge.cancelled { background: #f2f0f7; color: #5a4a86; }
    .badge.recovery { background: #fff3e0; color: #b25e09; border: 1px solid #e8b45a; }
    @keyframes dlz-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .badge.running::before, .phase-bar.running .phase-dot { animation: none; } }
    /* 状态阶段条：三态映射（QUEUED→排队 / RUNNING→执行 / 终态 / RECOVERY_REQUIRED 警示）。
       只映射真实 status，不虚报百分比（诚实展示原则）。 */
    .phase-bar { display: flex; gap: 6px; margin: 0 0 14px; }
    .phase-seg { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dlz-text-2); padding: 6px 8px; border-radius: 8px; background: var(--dlz-bg-3); border: 1px solid transparent; }
    .phase-dot { width: 8px; height: 8px; border-radius: 50%; background: #b9bdc4; flex: none; }
    .phase-bar.queued .phase-seg:nth-child(1),
    .phase-bar.running .phase-seg:nth-child(2),
    .phase-bar.terminal .phase-seg:nth-child(3) { border-color: var(--dlz-border); background: var(--dlz-bg-2); color: var(--dlz-text); font-weight: 650; }
    .phase-bar.queued .phase-seg:nth-child(1) .phase-dot { background: #8a8f98; }
    .phase-bar.running .phase-seg:nth-child(2) .phase-dot { background: var(--dlz-blue-fg); animation: dlz-pulse 1.2s ease-in-out infinite; }
    .phase-bar.terminal .phase-seg:nth-child(3) .phase-dot { background: #167347; }
    .phase-bar.recovery .phase-seg { border-color: #e8b45a; }
    .phase-bar.recovery .phase-seg:nth-child(2) { background: #fff3e0; color: #b25e09; font-weight: 650; }
    .phase-bar.recovery .phase-seg:nth-child(2) .phase-dot { background: #b25e09; }
    /* 关键字段网格：运行中整区浅色高亮，终态回落常色。 */
    .key-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 12px; }
    .field { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 9px; background: var(--dlz-bg-3); }
    .field .k { font-size: 11px; color: var(--dlz-text-2); }
    .field .v { overflow-wrap: anywhere; white-space: pre-wrap; }
    .key-fields.hot .field { background: #eef4fb; background: color-mix(in srgb, var(--dlz-blue-bg) 55%, var(--dlz-bg-3)); }
    .sub-fields { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 0 0 14px; }
    .sub-fields .k { color: var(--dlz-text-2); }
    .sub-fields .v { overflow-wrap: anywhere; white-space: pre-wrap; }
    .result { margin: 0 0 15px; padding: 11px 12px; border-radius: 9px; background: var(--dlz-bg-3); }
    .result[hidden] { display: none; }
    .result p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .result p.expanded { max-height: 50vh; overflow-y: auto; }
    #result_toggle { margin-top: 8px; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    button { border: 1px solid var(--dlz-border); background: var(--dlz-bg); color: inherit; border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 2px solid #3085d6; outline-offset: 2px; }
    label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    #message { min-height: 18px; margin: 10px 0 0; color: var(--dlz-text-2); font-size: 12px; }
    @media (max-width: 400px) {
      .card { padding: 14px; }
      .key-fields { grid-template-columns: 1fr; }
      .sub-fields { grid-template-columns: 100px 1fr; }
      .phase-bar { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="card" id="card_root" aria-label="大狸子任务卡">
    <header><h1>大狸子任务卡</h1><span id="status" class="badge">WAITING</span></header>
    <div id="phase_bar" class="phase-bar" role="img" aria-label="任务阶段：排队、执行、终态">
      <span class="phase-seg"><span class="phase-dot"></span>排队</span>
      <span class="phase-seg"><span class="phase-dot"></span>执行</span>
      <span class="phase-seg"><span class="phase-dot"></span>终态</span>
    </div>
    <section class="key-fields" id="key_fields">
      <div class="field"><span class="k">已运行</span><span class="v" id="elapsed">—</span></div>
      <div class="field"><span class="k">当前活动</span><span class="v" id="current_activity">—</span></div>
      <div class="field"><span class="k">模型</span><span class="v" id="requested_model">—</span></div>
      <div class="field"><span class="k">思考强度</span><span class="v" id="effort">—</span></div>
    </section>
    <section class="sub-fields">
      <span class="k">执行 Agent</span><span class="v" id="agent">—</span>
      <span class="k">项目</span><span class="v" id="project">—</span>
      <span class="k">最后更新</span><span class="v" id="last_updated">—</span>
      <span class="k">心跳/观察</span><span class="v" id="liveness">—</span>
    </section>
    <section id="usage_block" class="result" hidden>
      <h2>用量</h2>
      <p id="usage"></p>
    </section>
    <section id="result_block" class="result" hidden>
      <h2>结果</h2>
      <p id="result"></p>
      <button id="result_toggle" type="button" hidden></button>
    </section>
    <div class="actions">
      <button id="refresh" type="button" disabled>刷新</button>
      <label><input id="auto_refresh" type="checkbox" disabled> 自动刷新（3秒）</label>
    </div>
    <p id="message" role="status">等待 MCP Apps 宿主…</p>
  </main>
  <script>
    (() => {
      'use strict';
      const fields = Object.fromEntries(['agent', 'project', 'elapsed', 'current_activity', 'requested_model', 'effort', 'last_updated', 'liveness', 'usage', 'result', 'status'].map(id => [id, document.getElementById(id)]));
      const cardRoot = document.getElementById('card_root');
      const phaseBar = document.getElementById('phase_bar');
      const keyFields = document.getElementById('key_fields');
      const resultBlock = document.getElementById('result_block');
      const usageBlock = document.getElementById('usage_block');
      const resultToggle = document.getElementById('result_toggle');
      const refreshButton = document.getElementById('refresh');
      const autoBox = document.getElementById('auto_refresh');
      const message = document.getElementById('message');
      const pending = new Map();
      const TERMINAL_STATUSES = new Set(['COMPLETED', 'FAILED', 'CANCELLED']);
      const AUTO_REFRESH_MS = 3000;
      const ELAPSED_TICK_MS = 1000; // 走秒：每秒只重算已运行文本，不触发数据轮询
      const SIZE_DEBOUNCE_MS = 150; // size-changed 去抖窗口
      const RESULT_PREVIEW_LIMIT = 500; // 缩略态字符上限
      const RESULT_LINE_LIMIT = 8; // 缩略态行数上限
      const JOB_RESOURCE_URI_PREFIX = 'dlz://job/'; // CH1 只读资源通道（蓝图 §12.1）
      // 徽章五态 + QUEUED 映射（沿用 .badge 基类扩展；未知状态落默认蓝）
      const BADGE_CLASSES = { QUEUED: 'queued', RUNNING: 'running', COMPLETED: 'completed', FAILED: 'failed', CANCELLED: 'cancelled', RECOVERY_REQUIRED: 'recovery' };
      // 阶段条映射：QUEUED→排队 / RUNNING→执行 / 三种终态→终态 / RECOVERY_REQUIRED→警示；不虚报百分比。
      const PHASE_CLASSES = { QUEUED: 'queued', RUNNING: 'running', COMPLETED: 'terminal', FAILED: 'terminal', CANCELLED: 'terminal', RECOVERY_REQUIRED: 'recovery' };
      // 结果区就地展开状态（按 job_id 记忆）：刷新保持展开与滚动位置，切换 job 回到缩略默认。
      const resultExpansion = new Map(); // job_id -> { expanded: boolean, scrollTop: number }
      let currentResultText = ''; // 当前渲染的完整结果文本（供就地展开/收起复用）
      let nextId = 1;
      let initialized = false;
      let serverTools = false;
      let jobId = null;
      let status = null;
      let terminal = false;
      let timer = null; // 3s 数据轮询计时器
      let elapsedTimer = null; // 1s 走秒计时器（与轮询互不触发）
      let elapsedBase = null; // 走秒起点（started_at ?? created_at），null = 无起点
      let elapsedEnd = null; // 终态停表值（finished_at），null = 非终态
      let sizeObserver = null; // ResizeObserver 实例（dispose 时断连）
      let sizeDebounce = null; // size-changed 去抖计时器
      let lastSizeWidth = null; // 上次上报宽度（无变化不重发）
      let lastSizeHeight = null; // 上次上报高度
      let busy = false;
      let disposed = false;
      let lastRevision = null; // 已接受的 v2 快照 revision；null = 尚未接受过带 revision 的快照
      let lastSnapshot = null; // 最近一次成功渲染的快照（查询失败时保留展示）
      let pinnedOrigin = null; // 首帧运行时固定的宿主 origin
      // CH1 双路径（蓝图 §12.1）：资源优先 = resources/read 免授权只读 GET；
      // 首次读即一次性能力探测（不做周期探测），方法不存在/宿主无响应/结构不可用 →
      // resourceChannel=false，本会话内永久降级 tools/call get_task（loadResult 兜底路径不变）。
      let resourceChannel = true;
      let resourceProbed = false;

      // 桥接收敛（蓝图 §8 / IMPLEMENTATION §5.7，按 T0 §3.2 结论）：
      // 宿主 origin 不可静态枚举（卡片 iframe 为 srcdoc+sandbox、无 allow-same-origin），
      // 无法写死白名单。过渡方案：首个来自 window.parent 的合法 jsonrpc 封套到达后，
      // 用其 event.origin 运行时固定宿主 origin；此后接收端校验 origin 一致性，
      // 发送端 targetOrigin 收紧为该固定值。固定值为 "null"（opaque origin）时
      // 不能作为 targetOrigin，保留 '*' 过渡。宿主 origin 实测稳定后（T5/live 证据）
      // 再升级为常量白名单。
      function postToHost(packet) {
        window.parent.postMessage(packet, pinnedOrigin !== null && pinnedOrigin !== 'null' ? pinnedOrigin : '*');
      }

      function send(method, params, expectReply = false) {
        const packet = { jsonrpc: '2.0', method, params };
        if (!expectReply) { postToHost(packet); return Promise.resolve(); }
        packet.id = nextId++;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => { pending.delete(packet.id); reject(new Error('MCP Apps 宿主未响应')); }, 5000);
          pending.set(packet.id, { resolve, reject, timeout });
          postToHost(packet);
        });
      }

      function toMillis(value) {
        if (typeof value !== 'string' || value.length === 0) return null;
        const ms = Date.parse(value);
        return Number.isFinite(ms) ? ms : null;
      }
      function stamp(ms) {
        const iso = new Date(ms).toISOString();
        return `${iso.slice(0, 10)} ${iso.slice(11, 19)}Z`;
      }
      function duration(ms) {
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const seconds = totalSeconds % 60;
        if (hours > 0) return `${hours}h ${minutes}m`;
        if (minutes > 0) return `${minutes}m ${seconds}s`;
        return `${seconds}s`;
      }
      // 走秒解耦（P5 UX1 步骤 1）：快照到达只定起点/终点并渲染一次；
      // 非终态由 1s 计时器仅重算已运行文本，不与 3s 数据轮询互触发；
      // 终态 finished_at 定值停表。elapsedText 保留为单次快照的直接换算。
      function elapsedTick() { renderElapsed(); }
      elapsedTick.dlzTimerKind = 'elapsed'; // 计时器分类标记（数据轮询与走秒分流）
      function renderElapsed() {
        if (elapsedBase === null) { fields.elapsed.textContent = '—'; return; }
        const end = elapsedEnd ?? Date.now();
        fields.elapsed.textContent = duration(end - elapsedBase);
      }
      function startElapsed() {
        if (elapsedTimer === null) elapsedTimer = setInterval(elapsedTick, ELAPSED_TICK_MS);
      }
      function stopElapsed() {
        if (elapsedTimer !== null) clearInterval(elapsedTimer);
        elapsedTimer = null;
      }
      function elapsedText(task) {
        const start = toMillis(task.started_at) ?? toMillis(task.created_at);
        if (start === null) return '—';
        const end = toMillis(task.finished_at) ?? Date.now();
        return duration(end - start);
      }
      function lastUpdatedText(task) {
        const observed = [task.updated_at, task.finished_at, task.started_at, task.created_at].map(toMillis).filter(value => value !== null);
        return observed.length === 0 ? '—' : stamp(Math.max(...observed));
      }
      function resultText(task) {
        const error = task.error;
        if (error !== null && error !== undefined && error !== '') {
          return typeof error === 'string' ? error : JSON.stringify(error);
        }
        return typeof task.final_text === 'string' && task.final_text.length > 0 ? task.final_text : '';
      }
      // activity 诚实展示（蓝图 §5/§6）：有观测显示最近观测步骤+观测时间；无观测不编造。
      function activityText(task) {
        const activity = task.activity !== null && typeof task.activity === 'object' && !Array.isArray(task.activity) ? task.activity : null;
        if (activity !== null) {
          const text = [activity.label, activity.state, activity.kind].find(part => typeof part === 'string' && part.length > 0) ?? null;
          if (text !== null) {
            const at = toMillis(activity.observed_at);
            return at === null ? text : `${text}（观测于 ${stamp(at)}）`;
          }
        }
        return typeof task.current_activity === 'string' && task.current_activity.length > 0 ? task.current_activity : '—';
      }
      // liveness 诚实展示（蓝图 §7）：只展示实际观测到的心跳/事件/输出/进程检查证据，缺失不补造。
      function livenessText(task) {
        const liveness = task.liveness !== null && typeof task.liveness === 'object' && !Array.isArray(task.liveness) ? task.liveness : null;
        if (liveness === null) return '—';
        const parts = [];
        const heartbeat = toMillis(liveness.owner_heartbeat_at);
        if (heartbeat !== null) parts.push(`心跳 ${stamp(heartbeat)}`);
        const event = toMillis(liveness.last_event_at);
        if (event !== null) parts.push(`事件 ${stamp(event)}`);
        const output = toMillis(liveness.last_output_at);
        if (output !== null) parts.push(`输出 ${stamp(output)}`);
        const checked = toMillis(liveness.process_checked_at);
        if (checked !== null) parts.push(`进程检查 ${stamp(checked)}`);
        if (typeof liveness.process_state === 'string' && liveness.process_state.length > 0) parts.push(`进程${liveness.process_state}`);
        return parts.length === 0 ? '—' : parts.join(' · ');
      }
      // usage 诚实展示（蓝图 §5.6）：null≠0；未观测指标显示"不可观测"（含原因），不得显示为 0。
      function usageLines(usage) {
        if (usage === null || typeof usage !== 'object' || Array.isArray(usage) || Object.keys(usage).length === 0) {
          return ['不可观测（未收到用量指标）'];
        }
        return Object.entries(usage).map(([name, metric]) => {
          if (metric === null || metric === undefined) return `${name}：不可观测`;
          if (typeof metric === 'number') return `${name}：${metric}`;
          if (typeof metric === 'object' && !Array.isArray(metric)) {
            if (metric.value === null || metric.value === undefined) {
              const reason = typeof metric.unavailable_reason === 'string' && metric.unavailable_reason.length > 0 ? `（${metric.unavailable_reason}）` : '';
              return `${name}：不可观测${reason}`;
            }
            const unit = typeof metric.unit === 'string' && metric.unit.length > 0 ? ` ${metric.unit}` : '';
            const scope = typeof metric.scope === 'string' && metric.scope.length > 0 ? `（${metric.scope}）` : '';
            return `${name}：${metric.value}${unit}${scope}`;
          }
          return `${name}：${String(metric)}`;
        });
      }
      function statusMessage(current, isTerminal) {
        const auto = !isTerminal && autoBox.checked;
        if (isTerminal) return '任务已结束，自动刷新已停止。';
        if (current === 'RECOVERY_REQUIRED') return '状态不确定，需人工恢复确认（RECOVERY_REQUIRED），不代表任务仍在运行；请核实后由本地命令 npm run resolve-recovery 处理。';
        if (current === 'RUNNING') return auto ? '任务执行中，状态将自动刷新。' : '任务执行中，可手动刷新或勾选自动刷新。';
        if (current === 'QUEUED') return auto ? '任务排队中，状态将自动刷新。' : '任务排队中，可手动刷新或勾选自动刷新。';
        return auto ? '任务状态将自动刷新。' : '任务状态可手动刷新，或勾选自动刷新。';
      }

      function stopAuto() {
        if (timer) clearInterval(timer);
        timer = null;
      }
      function updateAuto() {
        if (disposed || !jobId || terminal || !autoBox.checked) { stopAuto(); return; }
        if (!timer) timer = setInterval(refresh, AUTO_REFRESH_MS);
      }

      // 宿主主题热更（P5 UX1 步骤 5）：host-context-changed 的 theme 写 dataset 锁定，
      // styles.variables 的原生命量（含宿主 --cb-* 集）落到根元素。
      // 首帧 hostContext 可能为空对象：无 theme 时不动 dataset，保持 CSS 层
      // color-scheme: light dark 兜底，待首条通知再锁定。
      function applyHostContext(hostContext) {
        if (hostContext === null || typeof hostContext !== 'object') return;
        const theme = hostContext.theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
        const variables = hostContext.styles?.variables;
        if (variables !== null && typeof variables === 'object' && !Array.isArray(variables)) {
          for (const [name, value] of Object.entries(variables)) {
            if (name.startsWith('--') && typeof value === 'string') {
              document.documentElement.style.setProperty(name, value);
            }
          }
        }
      }

      // size-changed 上报（P5 UX1 步骤 6，MCP Apps spec 2026-01-26）：
      // ResizeObserver 观察根卡片，高度/宽度变化经去抖后向宿主发尺寸通知，防 inline 截断。
      function reportSize() {
        if (disposed || sizeObserver === null) return;
        const width = typeof cardRoot.offsetWidth === 'number' ? cardRoot.offsetWidth : null;
        const height = typeof cardRoot.offsetHeight === 'number' ? cardRoot.offsetHeight : null;
        if (width === null || height === null) return;
        if (width === lastSizeWidth && height === lastSizeHeight) return; // 尺寸未变不重发
        lastSizeWidth = width;
        lastSizeHeight = height;
        send('ui/notifications/size-changed', { width, height });
      }
      function queueSizeReport() {
        if (disposed || sizeObserver === null) return;
        if (sizeDebounce !== null) clearTimeout(sizeDebounce);
        sizeDebounce = setTimeout(() => { sizeDebounce = null; reportSize(); }, SIZE_DEBOUNCE_MS);
      }
      function watchSize() {
        if (typeof ResizeObserver !== 'function' || cardRoot === null) return;
        sizeObserver = new ResizeObserver(() => queueSizeReport());
        sizeObserver.observe(cardRoot);
      }

      // 防旧响应（蓝图 §6.4）：仅当 job_id 匹配且 revision 更新时替换快照；
      // v1 快照（无 revision 字段）仅在从未接受过 v2 revision 时兼容接受，此后降级响应一律拒绝。
      function acceptsSnapshot(task) {
        if (!task || typeof task !== 'object' || task.job_id !== jobId) return false;
        if (typeof task.revision === 'number') return lastRevision === null || task.revision > lastRevision;
        return lastRevision === null;
      }

      // 绑定新 job 时清空旧 job 的展示，避免旧任务数据残留或被查询失败误保留。
      function resetDisplay() {
        for (const id of ['agent', 'project', 'elapsed', 'current_activity', 'requested_model', 'effort', 'last_updated', 'liveness']) {
          fields[id].textContent = '—';
        }
        fields.status.textContent = '—';
        fields.status.className = 'badge';
        phaseBar.className = 'phase-bar';
        keyFields.className = 'key-fields';
        stopElapsed();
        elapsedBase = null;
        elapsedEnd = null;
        fields.result.textContent = '';
        fields.result.className = '';
        fields.result.scrollTop = 0;
        currentResultText = '';
        resultToggle.hidden = true;
        resultToggle.textContent = '';
        resultBlock.hidden = true;
        fields.usage.textContent = '';
        usageBlock.hidden = true;
        autoBox.disabled = true;
        message.textContent = jobId ? '正在加载任务…' : '等待任务…';
      }

      // 结果区缩略/就地展开（微卡 T4-ux）：长文本默认缩略，点击就地展开/收起，不弹窗不跳转。
      function isCollapsible(text) {
        return text.length > RESULT_PREVIEW_LIMIT || text.split('\n').length > RESULT_LINE_LIMIT;
      }
      function resultPreview(text) {
        const head = text.slice(0, RESULT_PREVIEW_LIMIT);
        const lastBreak = head.lastIndexOf('\n');
        const cut = lastBreak === -1 ? head : head.slice(0, lastBreak);
        return `${cut} …`;
      }
      // 展开中：先把实时滚动位置记回状态，避免重渲染丢位置。
      function captureResultScroll() {
        const state = resultExpansion.get(jobId);
        if (state && state.expanded) state.scrollTop = fields.result.scrollTop ?? 0;
      }
      // 按当前 job 的记忆状态渲染结果区：短文本零行为变化；长文本缩略或展开。
      function applyResult(text) {
        const state = resultExpansion.get(jobId) ?? { expanded: false, scrollTop: 0 };
        if (!isCollapsible(text)) {
          fields.result.textContent = text;
          fields.result.className = '';
          fields.result.scrollTop = 0;
          resultToggle.hidden = true;
          resultToggle.textContent = '';
          return;
        }
        resultToggle.hidden = false;
        if (state.expanded) {
          fields.result.textContent = text;
          fields.result.className = 'expanded';
          fields.result.scrollTop = state.scrollTop;
          resultToggle.textContent = '收起';
        } else {
          fields.result.textContent = resultPreview(text);
          fields.result.className = '';
          fields.result.scrollTop = 0;
          resultToggle.textContent = `展开全文（共 ${text.length} 字符）`;
        }
      }
      function toggleResult() {
        if (jobId === null || !isCollapsible(currentResultText)) return;
        const state = resultExpansion.get(jobId) ?? { expanded: false, scrollTop: 0 };
        if (state.expanded) {
          state.scrollTop = fields.result.scrollTop ?? 0;
          state.expanded = false;
        } else {
          state.expanded = true;
        }
        resultExpansion.set(jobId, state);
        applyResult(currentResultText);
      }

      function showTask(task) {
        if (!acceptsSnapshot(task)) return;
        if (typeof task.revision === 'number') lastRevision = task.revision;
        lastSnapshot = task;
        const value = name => (typeof task[name] === 'string' && task[name].length > 0 ? task[name] : '—');
        fields.agent.textContent = value('agent');
        fields.project.textContent = value('project');
        elapsedBase = toMillis(task.started_at) ?? toMillis(task.created_at);
        renderElapsed();
        fields.current_activity.textContent = activityText(task);
        fields.requested_model.textContent = value('requested_model');
        fields.effort.textContent = value('effort');
        fields.last_updated.textContent = lastUpdatedText(task);
        fields.liveness.textContent = livenessText(task);
        fields.usage.textContent = usageLines(task.usage).join('\n');
        usageBlock.hidden = false;
        const result = resultText(task);
        currentResultText = result;
        captureResultScroll();
        applyResult(result);
        resultBlock.hidden = result === '';
        status = typeof task.status === 'string' && task.status.length > 0 ? task.status : 'UNKNOWN';
        terminal = TERMINAL_STATUSES.has(status);
        elapsedEnd = terminal ? toMillis(task.finished_at) : null; // 终态 reading：以 finished_at 停表
        renderElapsed();
        if (elapsedBase !== null && !terminal) startElapsed(); else stopElapsed();
        fields.status.textContent = status;
        fields.status.className = `badge ${BADGE_CLASSES[status] ?? ''}`.trim();
        phaseBar.className = `phase-bar ${PHASE_CLASSES[status] ?? ''}`.trim();
        keyFields.className = terminal ? 'key-fields' : 'key-fields hot';
        autoBox.disabled = terminal;
        message.textContent = statusMessage(status, terminal);
        updateAuto();
        queueSizeReport(); // 快照可能改变卡片高度（结果区展开/长文本）
      }
      function useResult(result) {
        if (result?.isError) throw new Error(result.content?.[0]?.text ?? 'Tool failed');
        const task = result?.structuredContent ?? JSON.parse(result?.content?.[0]?.text ?? 'null');
        showTask(task);
      }

      // CH1 资源响应 → TaskSnapshot：contents[0].text 为与 get_task structuredContent
      // 完全同形的 JSON 文本（蓝图 §12.1）；结构不可用 = 宿主未实现资源通道的判定信号。
      function resourceTaskOf(result) {
        const text = Array.isArray(result?.contents) ? result.contents[0]?.text : null;
        if (typeof text !== 'string') {
          const error = new Error('资源响应不可用（缺少 JSON 文本）');
          error.resourceChannelUnavailable = true;
          throw error;
        }
        return JSON.parse(text);
      }
      // 宿主层方法不可用信号：未实现 resources/read（method not found 类）或静默无响应
      // （send 5s 超时）。资源/传输性失败（如 Resource not found）不在此列——通道可达，不降级。
      function isResourceChannelUnavailable(error) {
        if (error?.resourceChannelUnavailable === true) return true;
        const message = error instanceof Error ? error.message : String(error ?? '');
        return /method not found|unknown method|not supported|unsupported|宿主未响应/i.test(message);
      }

      // 查询失败 ≠ job 失败（蓝图 §6.5）：保留上次成功快照，显示错误与最后更新时间，允许重试。
      function reportQueryFailure(error) {
        const at = lastSnapshot === null ? null : lastUpdatedText(lastSnapshot);
        message.textContent = at === null
          ? `刷新失败：${error.message}；尚无成功快照，可重试。`
          : `刷新失败：${error.message}；已保留最后成功快照（更新于 ${at}），可重试。`;
      }

      async function refresh() {
        if (busy || !jobId || disposed) return;
        busy = true;
        refreshButton.disabled = true;
        try {
          if (initialized && serverTools) {
            if (resourceChannel && !resourceProbed) {
              // 首次资源读 = 一次性能力探测：失败信号出现即标记能力缺失，本会话内永久降级
              // tools/call get_task，并立即以工具路径完成本次刷新（降级不造成功能缺失）。
              try {
                showTask(resourceTaskOf(await send('resources/read', { uri: `${JOB_RESOURCE_URI_PREFIX}${jobId}` }, true)));
                resourceProbed = true;
              } catch (probeError) {
                if (!isResourceChannelUnavailable(probeError)) throw probeError; // 传输/业务失败：等同查询失败，不降级
                resourceChannel = false;
                useResult(await send('tools/call', { name: 'get_task', arguments: { job_id: jobId } }, true));
              }
            } else if (resourceChannel) {
              // 资源优先（免授权只读 GET）：查询性失败语义等同查询失败——保留快照、提示、可重试。
              showTask(resourceTaskOf(await send('resources/read', { uri: `${JOB_RESOURCE_URI_PREFIX}${jobId}` }, true)));
            } else {
              // 永久降级路径：tools/call get_task 兜底（CH1 前行为零回退）。
              useResult(await send('tools/call', { name: 'get_task', arguments: { job_id: jobId } }, true));
            }
          } else if (typeof window.openai?.callTool === 'function') {
            // T0 C4：WorkBuddy 宿主无 window.openai（app.asar 0 命中）；仅作其他宿主过渡回退保留。
            useResult(await window.openai.callTool('get_task', { job_id: jobId }));
          } else {
            throw new Error('MCP Apps 宿主未提供 serverTools 能力');
          }
          // 查询成功：即使快照因重复/过旧 revision 未替换，也清除历史失败提示，回到当前状态提示。
          if (lastSnapshot !== null) message.textContent = statusMessage(status, terminal);
        } catch (error) {
          reportQueryFailure(error);
        } finally {
          busy = false;
          refreshButton.disabled = disposed || !jobId;
        }
      }
      function dispose() {
        disposed = true;
        stopAuto();
        stopElapsed();
        if (sizeObserver !== null) { sizeObserver.disconnect(); sizeObserver = null; }
        if (sizeDebounce !== null) { clearTimeout(sizeDebounce); sizeDebounce = null; }
        for (const item of pending.values()) { clearTimeout(item.timeout); item.reject(new Error('卡片已卸载')); }
        pending.clear();
      }

      window.addEventListener('message', event => {
        // 结构前置校验：只认来自 window.parent 的 jsonrpc 2.0 封套（§5.7 过渡期三要素之一）。
        if (event.source !== window.parent || disposed) return;
        const packet = event.data;
        if (!packet || typeof packet !== 'object' || packet.jsonrpc !== '2.0') return;
        if (pinnedOrigin === null) {
          if (typeof event.origin === 'string' && event.origin.length > 0) pinnedOrigin = event.origin;
        } else if (event.origin !== pinnedOrigin) {
          return; // 偏离首帧固定 origin 的消息：丢弃
        }
        if (Object.hasOwn(packet, 'id') && pending.has(packet.id)) {
          const item = pending.get(packet.id);
          pending.delete(packet.id);
          clearTimeout(item.timeout);
          if (packet.error) item.reject(new Error(packet.error.message ?? 'MCP Apps request failed'));
          else item.resolve(packet.result);
          return;
        }
        if (packet.method === 'ui/notifications/tool-input') {
          const nextJobId = packet.params?.arguments?.job_id ?? null;
          if (nextJobId !== jobId) {
            stopAuto();
            jobId = nextJobId;
            lastRevision = null;
            lastSnapshot = null;
            status = null;
            terminal = false;
            resetDisplay();
          }
          refreshButton.disabled = !jobId;
        } else if (packet.method === 'ui/notifications/tool-result') {
          try { useResult(packet.params); } catch (error) { reportQueryFailure(error); }
        } else if (packet.method === 'ui/notifications/host-context-changed') {
          applyHostContext(packet.params);
        } else if (packet.method === 'ui/resource-teardown' && Object.hasOwn(packet, 'id')) {
          dispose();
          postToHost({ jsonrpc: '2.0', id: packet.id, result: {} });
        }
      });
      refreshButton.addEventListener('click', refresh);
      resultToggle.addEventListener('click', toggleResult);
      // 自动刷新开关仅由用户操作改变；程序只负责启停计时器（A7）。
      autoBox.addEventListener('change', () => {
        updateAuto();
        if (lastSnapshot !== null) message.textContent = statusMessage(status, terminal);
      });
      window.addEventListener('pagehide', dispose);
      send('ui/initialize', { appInfo: { name: 'Dalizi Task Card', version: '1.0.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' }, true)
        .then(result => {
          if (disposed) return;
          initialized = true;
          serverTools = Boolean(result?.hostCapabilities?.serverTools);
          applyHostContext(result?.hostContext); // 首帧 hostContext 可能为空对象（已知行为），空则保持 CSS 兜底
          send('ui/notifications/initialized', {});
          message.textContent = '等待任务…';
        })
        .catch(error => { if (!disposed) message.textContent = error.message; });
      watchSize(); // ResizeObserver 常驻观察根卡片，高度变化去抖上报，防 inline 截断
    })();
  </script>
</body>
</html>
