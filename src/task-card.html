<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大力子任务卡</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px; color: var(--color-text-primary, #202123); background: var(--color-background-primary, #fff); }
    .card { max-width: 560px; border: 1px solid var(--color-border-default, #dedede); border-radius: 14px; padding: 18px; background: var(--color-background-secondary, #fff); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 16px; font-weight: 650; }
    h2 { margin: 0 0 6px; font-size: 12px; font-weight: 650; color: var(--color-text-secondary, #6b6b6b); }
    .badge { border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700; background: #e9f4ff; color: #1264a3; }
    .badge.completed { background: #e5f6ed; color: #167347; }
    .badge.failed { background: #fce9e9; color: #a33030; }
    .badge.cancelled { background: #f2f0f7; color: #5a4a86; }
    .badge.recovery { background: #fff3e0; color: #b25e09; border: 1px solid #e8b45a; }
    dl { display: grid; grid-template-columns: 132px 1fr; gap: 7px 12px; margin: 0 0 16px; }
    dt { color: var(--color-text-secondary, #6b6b6b); }
    dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .result { margin: 0 0 15px; padding: 11px 12px; border-radius: 9px; background: var(--color-background-tertiary, #f5f5f5); }
    .result[hidden] { display: none; }
    .result p { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .result p.expanded { max-height: 50vh; overflow-y: auto; }
    #result_toggle { margin-top: 8px; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    button { border: 1px solid var(--color-border-default, #d0d0d0); background: var(--color-background-primary, #fff); color: inherit; border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 2px solid #3085d6; outline-offset: 2px; }
    label { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    #message { min-height: 18px; margin: 10px 0 0; color: var(--color-text-secondary, #666); font-size: 12px; }
    @media (max-width: 400px) { dl { grid-template-columns: 100px 1fr; } .card { padding: 14px; } }
  </style>
</head>
<body>
  <main class="card" aria-label="大力子任务卡">
    <header><h1>大力子任务卡</h1><span id="status" class="badge">WAITING</span></header>
    <dl>
      <dt>执行 Agent</dt><dd id="agent">—</dd>
      <dt>项目</dt><dd id="project">—</dd>
      <dt>已运行</dt><dd id="elapsed">—</dd>
      <dt>当前活动</dt><dd id="current_activity">—</dd>
      <dt>模型</dt><dd id="requested_model">—</dd>
      <dt>思考强度</dt><dd id="effort">—</dd>
      <dt>最后更新</dt><dd id="last_updated">—</dd>
      <dt>心跳/观察</dt><dd id="liveness">—</dd>
    </dl>
    <section id="usage_block" class="result" hidden>
      <h2>用量</h2>
      <p id="usage"></p>
    </section>
    <section id="result_block" class="result" hidden>
      <h2>结果</h2>
      <p id="result"></p>
      <button id="result_toggle" type="button" hidden></button>
    </section>
    <div class="actions">
      <button id="refresh" type="button" disabled>刷新</button>
      <label><input id="auto_refresh" type="checkbox" disabled> 自动刷新（3秒）</label>
    </div>
    <p id="message" role="status">等待 MCP Apps 宿主…</p>
  </main>
  <script>
    (() => {
      'use strict';
      const fields = Object.fromEntries(['agent', 'project', 'elapsed', 'current_activity', 'requested_model', 'effort', 'last_updated', 'liveness', 'usage', 'result', 'status'].map(id => [id, document.getElementById(id)]));
      const resultBlock = document.getElementById('result_block');
      const usageBlock = document.getElementById('usage_block');
      const resultToggle = document.getElementById('result_toggle');
      const refreshButton = document.getElementById('refresh');
      const autoBox = document.getElementById('auto_refresh');
      const message = document.getElementById('message');
      const pending = new Map();
      const TERMINAL_STATUSES = new Set(['COMPLETED', 'FAILED', 'CANCELLED']);
      const AUTO_REFRESH_MS = 3000;
      const RESULT_PREVIEW_LIMIT = 500; // 缩略态字符上限
      const RESULT_LINE_LIMIT = 8; // 缩略态行数上限
      // 结果区就地展开状态（按 job_id 记忆）：刷新保持展开与滚动位置，切换 job 回到缩略默认。
      const resultExpansion = new Map(); // job_id -> { expanded: boolean, scrollTop: number }
      let currentResultText = ''; // 当前渲染的完整结果文本（供就地展开/收起复用）
      let nextId = 1;
      let initialized = false;
      let serverTools = false;
      let jobId = null;
      let status = null;
      let terminal = false;
      let timer = null;
      let busy = false;
      let disposed = false;
      let lastRevision = null; // 已接受的 v2 快照 revision；null = 尚未接受过带 revision 的快照
      let lastSnapshot = null; // 最近一次成功渲染的快照（查询失败时保留展示）
      let pinnedOrigin = null; // 首帧运行时固定的宿主 origin

      // 桥接收敛（蓝图 §8 / IMPLEMENTATION §5.7，按 T0 §3.2 结论）：
      // 宿主 origin 不可静态枚举（卡片 iframe 为 srcdoc+sandbox、无 allow-same-origin），
      // 无法写死白名单。过渡方案：首个来自 window.parent 的合法 jsonrpc 封套到达后，
      // 用其 event.origin 运行时固定宿主 origin；此后接收端校验 origin 一致性，
      // 发送端 targetOrigin 收紧为该固定值。固定值为 "null"（opaque origin）时
      // 不能作为 targetOrigin，保留 '*' 过渡。宿主 origin 实测稳定后（T5/live 证据）
      // 再升级为常量白名单。
      function postToHost(packet) {
        window.parent.postMessage(packet, pinnedOrigin !== null && pinnedOrigin !== 'null' ? pinnedOrigin : '*');
      }

      function send(method, params, expectReply = false) {
        const packet = { jsonrpc: '2.0', method, params };
        if (!expectReply) { postToHost(packet); return Promise.resolve(); }
        packet.id = nextId++;
        return new Promise((resolve, reject) => {
          const timeout = setTimeout(() => { pending.delete(packet.id); reject(new Error('MCP Apps 宿主未响应')); }, 5000);
          pending.set(packet.id, { resolve, reject, timeout });
          postToHost(packet);
        });
      }

      function toMillis(value) {
        if (typeof value !== 'string' || value.length === 0) return null;
        const ms = Date.parse(value);
        return Number.isFinite(ms) ? ms : null;
      }
      function stamp(ms) {
        const iso = new Date(ms).toISOString();
        return `${iso.slice(0, 10)} ${iso.slice(11, 19)}Z`;
      }
      function duration(ms) {
        const totalSeconds = Math.max(0, Math.floor(ms / 1000));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor(totalSeconds / 60) % 60;
        const seconds = totalSeconds % 60;
        if (hours > 0) return `${hours}h ${minutes}m`;
        if (minutes > 0) return `${minutes}m ${seconds}s`;
        return `${seconds}s`;
      }
      function elapsedText(task) {
        const start = toMillis(task.started_at) ?? toMillis(task.created_at);
        if (start === null) return '—';
        const end = toMillis(task.finished_at) ?? Date.now();
        return duration(end - start);
      }
      function lastUpdatedText(task) {
        const observed = [task.updated_at, task.finished_at, task.started_at, task.created_at].map(toMillis).filter(value => value !== null);
        return observed.length === 0 ? '—' : stamp(Math.max(...observed));
      }
      function resultText(task) {
        const error = task.error;
        if (error !== null && error !== undefined && error !== '') {
          return typeof error === 'string' ? error : JSON.stringify(error);
        }
        return typeof task.final_text === 'string' && task.final_text.length > 0 ? task.final_text : '';
      }
      // activity 诚实展示（蓝图 §5/§6）：有观测显示最近观测步骤+观测时间；无观测不编造。
      function activityText(task) {
        const activity = task.activity !== null && typeof task.activity === 'object' && !Array.isArray(task.activity) ? task.activity : null;
        if (activity !== null) {
          const text = [activity.label, activity.state, activity.kind].find(part => typeof part === 'string' && part.length > 0) ?? null;
          if (text !== null) {
            const at = toMillis(activity.observed_at);
            return at === null ? text : `${text}（观测于 ${stamp(at)}）`;
          }
        }
        return typeof task.current_activity === 'string' && task.current_activity.length > 0 ? task.current_activity : '—';
      }
      // liveness 诚实展示（蓝图 §7）：只展示实际观测到的心跳/事件/输出/进程检查证据，缺失不补造。
      function livenessText(task) {
        const liveness = task.liveness !== null && typeof task.liveness === 'object' && !Array.isArray(task.liveness) ? task.liveness : null;
        if (liveness === null) return '—';
        const parts = [];
        const heartbeat = toMillis(liveness.owner_heartbeat_at);
        if (heartbeat !== null) parts.push(`心跳 ${stamp(heartbeat)}`);
        const event = toMillis(liveness.last_event_at);
        if (event !== null) parts.push(`事件 ${stamp(event)}`);
        const output = toMillis(liveness.last_output_at);
        if (output !== null) parts.push(`输出 ${stamp(output)}`);
        const checked = toMillis(liveness.process_checked_at);
        if (checked !== null) parts.push(`进程检查 ${stamp(checked)}`);
        if (typeof liveness.process_state === 'string' && liveness.process_state.length > 0) parts.push(`进程${liveness.process_state}`);
        return parts.length === 0 ? '—' : parts.join(' · ');
      }
      // usage 诚实展示（蓝图 §5.6）：null≠0；未观测指标显示"不可观测"（含原因），不得显示为 0。
      function usageLines(usage) {
        if (usage === null || typeof usage !== 'object' || Array.isArray(usage) || Object.keys(usage).length === 0) {
          return ['不可观测（未收到用量指标）'];
        }
        return Object.entries(usage).map(([name, metric]) => {
          if (metric === null || metric === undefined) return `${name}：不可观测`;
          if (typeof metric === 'number') return `${name}：${metric}`;
          if (typeof metric === 'object' && !Array.isArray(metric)) {
            if (metric.value === null || metric.value === undefined) {
              const reason = typeof metric.unavailable_reason === 'string' && metric.unavailable_reason.length > 0 ? `（${metric.unavailable_reason}）` : '';
              return `${name}：不可观测${reason}`;
            }
            const unit = typeof metric.unit === 'string' && metric.unit.length > 0 ? ` ${metric.unit}` : '';
            const scope = typeof metric.scope === 'string' && metric.scope.length > 0 ? `（${metric.scope}）` : '';
            return `${name}：${metric.value}${unit}${scope}`;
          }
          return `${name}：${String(metric)}`;
        });
      }
      function statusMessage(current, isTerminal) {
        const auto = !isTerminal && autoBox.checked;
        if (isTerminal) return '任务已结束，自动刷新已停止。';
        if (current === 'RECOVERY_REQUIRED') return '状态不确定，需人工恢复确认（RECOVERY_REQUIRED），不代表任务仍在运行；请核实后由本地命令 npm run resolve-recovery 处理。';
        if (current === 'RUNNING') return auto ? '任务执行中，状态将自动刷新。' : '任务执行中，可手动刷新或勾选自动刷新。';
        if (current === 'QUEUED') return auto ? '任务排队中，状态将自动刷新。' : '任务排队中，可手动刷新或勾选自动刷新。';
        return auto ? '任务状态将自动刷新。' : '任务状态可手动刷新，或勾选自动刷新。';
      }

      function stopAuto() {
        if (timer) clearInterval(timer);
        timer = null;
      }
      function updateAuto() {
        if (disposed || !jobId || terminal || !autoBox.checked) { stopAuto(); return; }
        if (!timer) timer = setInterval(refresh, AUTO_REFRESH_MS);
      }

      // 防旧响应（蓝图 §6.4）：仅当 job_id 匹配且 revision 更新时替换快照；
      // v1 快照（无 revision 字段）仅在从未接受过 v2 revision 时兼容接受，此后降级响应一律拒绝。
      function acceptsSnapshot(task) {
        if (!task || typeof task !== 'object' || task.job_id !== jobId) return false;
        if (typeof task.revision === 'number') return lastRevision === null || task.revision > lastRevision;
        return lastRevision === null;
      }

      // 绑定新 job 时清空旧 job 的展示，避免旧任务数据残留或被查询失败误保留。
      function resetDisplay() {
        for (const id of ['agent', 'project', 'elapsed', 'current_activity', 'requested_model', 'effort', 'last_updated', 'liveness']) {
          fields[id].textContent = '—';
        }
        fields.status.textContent = '—';
        fields.status.className = 'badge';
        fields.result.textContent = '';
        fields.result.className = '';
        fields.result.scrollTop = 0;
        currentResultText = '';
        resultToggle.hidden = true;
        resultToggle.textContent = '';
        resultBlock.hidden = true;
        fields.usage.textContent = '';
        usageBlock.hidden = true;
        autoBox.disabled = true;
        message.textContent = jobId ? '正在加载任务…' : '等待任务…';
      }

      // 结果区缩略/就地展开（微卡 T4-ux）：长文本默认缩略，点击就地展开/收起，不弹窗不跳转。
      function isCollapsible(text) {
        return text.length > RESULT_PREVIEW_LIMIT || text.split('\n').length > RESULT_LINE_LIMIT;
      }
      function resultPreview(text) {
        const head = text.slice(0, RESULT_PREVIEW_LIMIT);
        const lastBreak = head.lastIndexOf('\n');
        const cut = lastBreak === -1 ? head : head.slice(0, lastBreak);
        return `${cut} …`;
      }
      // 展开中：先把实时滚动位置记回状态，避免重渲染丢位置。
      function captureResultScroll() {
        const state = resultExpansion.get(jobId);
        if (state && state.expanded) state.scrollTop = fields.result.scrollTop ?? 0;
      }
      // 按当前 job 的记忆状态渲染结果区：短文本零行为变化；长文本缩略或展开。
      function applyResult(text) {
        const state = resultExpansion.get(jobId) ?? { expanded: false, scrollTop: 0 };
        if (!isCollapsible(text)) {
          fields.result.textContent = text;
          fields.result.className = '';
          fields.result.scrollTop = 0;
          resultToggle.hidden = true;
          resultToggle.textContent = '';
          return;
        }
        resultToggle.hidden = false;
        if (state.expanded) {
          fields.result.textContent = text;
          fields.result.className = 'expanded';
          fields.result.scrollTop = state.scrollTop;
          resultToggle.textContent = '收起';
        } else {
          fields.result.textContent = resultPreview(text);
          fields.result.className = '';
          fields.result.scrollTop = 0;
          resultToggle.textContent = `展开全文（共 ${text.length} 字符）`;
        }
      }
      function toggleResult() {
        if (jobId === null || !isCollapsible(currentResultText)) return;
        const state = resultExpansion.get(jobId) ?? { expanded: false, scrollTop: 0 };
        if (state.expanded) {
          state.scrollTop = fields.result.scrollTop ?? 0;
          state.expanded = false;
        } else {
          state.expanded = true;
        }
        resultExpansion.set(jobId, state);
        applyResult(currentResultText);
      }

      function showTask(task) {
        if (!acceptsSnapshot(task)) return;
        if (typeof task.revision === 'number') lastRevision = task.revision;
        lastSnapshot = task;
        const value = name => (typeof task[name] === 'string' && task[name].length > 0 ? task[name] : '—');
        fields.agent.textContent = value('agent');
        fields.project.textContent = value('project');
        fields.elapsed.textContent = elapsedText(task);
        fields.current_activity.textContent = activityText(task);
        fields.requested_model.textContent = value('requested_model');
        fields.effort.textContent = value('effort');
        fields.last_updated.textContent = lastUpdatedText(task);
        fields.liveness.textContent = livenessText(task);
        fields.usage.textContent = usageLines(task.usage).join('\n');
        usageBlock.hidden = false;
        const result = resultText(task);
        currentResultText = result;
        captureResultScroll();
        applyResult(result);
        resultBlock.hidden = result === '';
        status = typeof task.status === 'string' && task.status.length > 0 ? task.status : 'UNKNOWN';
        terminal = TERMINAL_STATUSES.has(status);
        fields.status.textContent = status;
        fields.status.className = `badge ${status === 'COMPLETED' ? 'completed' : status === 'FAILED' ? 'failed' : status === 'CANCELLED' ? 'cancelled' : status === 'RECOVERY_REQUIRED' ? 'recovery' : ''}`;
        autoBox.disabled = terminal;
        message.textContent = statusMessage(status, terminal);
        updateAuto();
      }
      function useResult(result) {
        if (result?.isError) throw new Error(result.content?.[0]?.text ?? 'Tool failed');
        const task = result?.structuredContent ?? JSON.parse(result?.content?.[0]?.text ?? 'null');
        showTask(task);
      }

      // 查询失败 ≠ job 失败（蓝图 §6.5）：保留上次成功快照，显示错误与最后更新时间，允许重试。
      function reportQueryFailure(error) {
        const at = lastSnapshot === null ? null : lastUpdatedText(lastSnapshot);
        message.textContent = at === null
          ? `刷新失败：${error.message}；尚无成功快照，可重试。`
          : `刷新失败：${error.message}；已保留最后成功快照（更新于 ${at}），可重试。`;
      }

      async function refresh() {
        if (busy || !jobId || disposed) return;
        busy = true;
        refreshButton.disabled = true;
        try {
          let result;
          if (initialized && serverTools) {
            result = await send('tools/call', { name: 'get_task', arguments: { job_id: jobId } }, true);
          } else if (typeof window.openai?.callTool === 'function') {
            // T0 C4：WorkBuddy 宿主无 window.openai（app.asar 0 命中）；仅作其他宿主过渡回退保留。
            result = await window.openai.callTool('get_task', { job_id: jobId });
          } else {
            throw new Error('MCP Apps 宿主未提供 serverTools 能力');
          }
          useResult(result);
          // 查询成功：即使快照因重复/过旧 revision 未替换，也清除历史失败提示，回到当前状态提示。
          if (lastSnapshot !== null) message.textContent = statusMessage(status, terminal);
        } catch (error) {
          reportQueryFailure(error);
        } finally {
          busy = false;
          refreshButton.disabled = disposed || !jobId;
        }
      }
      function dispose() {
        disposed = true;
        stopAuto();
        for (const item of pending.values()) { clearTimeout(item.timeout); item.reject(new Error('卡片已卸载')); }
        pending.clear();
      }

      window.addEventListener('message', event => {
        // 结构前置校验：只认来自 window.parent 的 jsonrpc 2.0 封套（§5.7 过渡期三要素之一）。
        if (event.source !== window.parent || disposed) return;
        const packet = event.data;
        if (!packet || typeof packet !== 'object' || packet.jsonrpc !== '2.0') return;
        if (pinnedOrigin === null) {
          if (typeof event.origin === 'string' && event.origin.length > 0) pinnedOrigin = event.origin;
        } else if (event.origin !== pinnedOrigin) {
          return; // 偏离首帧固定 origin 的消息：丢弃
        }
        if (Object.hasOwn(packet, 'id') && pending.has(packet.id)) {
          const item = pending.get(packet.id);
          pending.delete(packet.id);
          clearTimeout(item.timeout);
          if (packet.error) item.reject(new Error(packet.error.message ?? 'MCP Apps request failed'));
          else item.resolve(packet.result);
          return;
        }
        if (packet.method === 'ui/notifications/tool-input') {
          const nextJobId = packet.params?.arguments?.job_id ?? null;
          if (nextJobId !== jobId) {
            stopAuto();
            jobId = nextJobId;
            lastRevision = null;
            lastSnapshot = null;
            status = null;
            terminal = false;
            resetDisplay();
          }
          refreshButton.disabled = !jobId;
        } else if (packet.method === 'ui/notifications/tool-result') {
          try { useResult(packet.params); } catch (error) { reportQueryFailure(error); }
        } else if (packet.method === 'ui/resource-teardown' && Object.hasOwn(packet, 'id')) {
          dispose();
          postToHost({ jsonrpc: '2.0', id: packet.id, result: {} });
        }
      });
      refreshButton.addEventListener('click', refresh);
      resultToggle.addEventListener('click', toggleResult);
      // 自动刷新开关仅由用户操作改变；程序只负责启停计时器（A7）。
      autoBox.addEventListener('change', () => {
        updateAuto();
        if (lastSnapshot !== null) message.textContent = statusMessage(status, terminal);
      });
      window.addEventListener('pagehide', dispose);
      send('ui/initialize', { appInfo: { name: 'Dalizi Task Card', version: '1.0.0' }, appCapabilities: {}, protocolVersion: '2026-01-26' }, true)
        .then(result => {
          if (disposed) return;
          initialized = true;
          serverTools = Boolean(result?.hostCapabilities?.serverTools);
          send('ui/notifications/initialized', {});
          message.textContent = '等待任务…';
        })
        .catch(error => { if (!disposed) message.textContent = error.message; });
    })();
  </script>
</body>
</html>
